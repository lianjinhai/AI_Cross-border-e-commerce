name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      # 用锁定清单安装（DEBT-22）：CI 结果与本地、与镜像一致
      - run: pip install -r requirements-dev.lock.txt
      # 代码检查：当前以「功能性缺陷」为门禁（见 docs/CODE_AND_DIRECTORY_STANDARD.md §9.4）
      # 存量风格告警清零后，再逐步收紧规则集。
      - run: python -m ruff check .
      - run: python -m pytest -q
      # 文档一致性（Doc-5）：基线数字必须与单一事实源一致、路径引用有效、
      # 台账状态自洽。此前这些全靠人工记忆，实测 26 处漂移无人察觉。
      # 顺序：先校验文档（秒级），再刷新基线（需要 node，故放在前端 job）。
      - run: python scripts/check_docs_consistency.py

  # 基线单一事实源校验：后端与前端用例数必须与 docs/baseline.json 一致。
  # 独立 job 因为它同时需要 Python 与 Node。
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.lock.txt
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      # 采集真实用例数并与 docs/baseline.json 比对；不一致即失败，
      # 强制提交者运行 refresh_test_baseline.py 更新事实源。
      - run: python backend/scripts/refresh_test_baseline.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build
