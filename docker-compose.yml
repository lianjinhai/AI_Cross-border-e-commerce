services:
  erp:
    build: .
    container_name: ai-commerce-erp
    ports:
      - "8000:8000"
    environment:
      ERP_DB_URL: sqlite:////data/erp.db
      # 生产模式：启用 config.validate_production_settings() 的全部门禁
      # （弱 JWT 密钥 / 默认管理员口令 / 缺凭证加密密钥 / 空 CORS 都会拒绝启动）
      ERP_ENV: production
      # 以下四项必填，故意不给默认值：未在 .env 中配置则 compose 直接报错，
      # 避免"带着开发默认密钥上线"这种静默危险状态。
      ERP_JWT_SECRET: ${ERP_JWT_SECRET:?必须设置 ERP_JWT_SECRET（至少 32 字节）}
      ERP_ADMIN_PASSWORD: ${ERP_ADMIN_PASSWORD:?必须设置 ERP_ADMIN_PASSWORD（不得为 admin123）}
      ERP_CREDENTIAL_KEY: ${ERP_CREDENTIAL_KEY:?必须设置 ERP_CREDENTIAL_KEY（店铺凭证加密密钥）}
      ERP_CORS_ORIGINS: ${ERP_CORS_ORIGINS:?必须设置 ERP_CORS_ORIGINS（明确域名白名单，不得为 *）}
      ERP_SUPERADMIN_PASSWORD: ${ERP_SUPERADMIN_PASSWORD:-}
      ERP_PUBLIC_BASE_URL: ${ERP_PUBLIC_BASE_URL:-}
      ERP_LLM_API_KEY: ${ERP_LLM_API_KEY:-}
      ERP_LLM_BASE_URL: ${ERP_LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      ERP_LLM_MODEL: ${ERP_LLM_MODEL:-glm-4-flash}
    volumes:
      - erp-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 生产建议切换 MySQL：docker compose --profile mysql up -d
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-erp_root_pwd}
      MYSQL_DATABASE: erp
      MYSQL_USER: erp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-erp_pwd}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  erp-data:
  mysql-data:
